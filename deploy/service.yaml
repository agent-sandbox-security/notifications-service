# Deployed by the platform pipeline from main.
service: notifications
owner: team-growth
role: notif-task-role
extra_roles: [payments-shared-role]
environments:
  staging:
    log_group: notif-staging-logs
  prod:
    log_group: notif-prod-logs
env:
  SENDGRID_API_KEY: { secret: notif-sendgrid-key }
  EVENTS_QUEUE: { queue: payments-events }
  SENDER_DOMAIN: mailer.acme-tx9.net
